steps:
  - name: 'gcr.io/cloud-builders/mvn'
    args:
      - clean
      - package
      - -DskipTests

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        SAFE_BRANCH=$(echo "${BRANCH_NAME}" | tr '/' '-')
        
        if [ "${BRANCH_NAME}" = "main" ]; then
         VERSION="$$TIMESTAMP"
        else
         VERSION="$${SAFE_BRANCH}-$${TIMESTAMP}"
        fi
        echo "Using image tag: $$VERSION"
        echo "$$VERSION" > /workspace/image-tag.txt
        docker build \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/one-step-repo/spring-dsl-flow:latest \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/one-step-repo/spring-dsl-flow:$$VERSION \
          .
        docker push asia-south1-docker.pkg.dev/$PROJECT_ID/one-step-repo/spring-dsl-flow:latest
        docker push asia-south1-docker.pkg.dev/$PROJECT_ID/one-step-repo/spring-dsl-flow:$$VERSION
